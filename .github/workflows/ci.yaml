name: Continuous Integration

on:
  push:
    branches:
      - feature/**

jobs:
    build:
        runs-on: ubuntu-latest
        steps: #90% dos jobs começam com um clone do código (checkout)
            - name: Checkout
              uses: actions/checkout@v5 #quando abrimos o repo conseguimos ver a versão (nesse caso é a 5)
            - name: Build da Aplicacao
              run: mvn clean package
            - name: Execução de Testes Unitários
              run: mvn test